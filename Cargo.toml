# crossbeam-skiplist = { path = "deps/crossbeam_rubicon/crossbeam-skiplist" }
crossbeam-utils = { path = "deps/crossbeam_rubicon/crossbeam-utils" }
sharded-slab = { path = "deps/sharded-slab_rubicon" }
