language: Rust
id: find-unsafe-statics
rule:
  any:
    - kind: static_item
    - kind: macro_invocation
      any:
        - has:
            kind: identifier
            pattern: thread_local
        - has:
            kind: scoped_identifier
            regex: "std::thread_local"
    - kind: macro_invocation
      any:
        - has:
            kind: identifier
            pattern: lazy_static
        - has:
            kind: scoped_identifier
            regex: "lazy_static::lazy_static"
    - kind: macro_invocation
      all:
        - has:
            kind: identifier
            pattern: tokio_thread_local
        - not:
            has:
              kind: token_tree
              regex: "TOKIO_"
  not:
    inside:
      kind: mod_item
      any:
        - has:
            kind: identifier
            any:
              - pattern: tests
              - pattern: test
              - pattern: test_util
            stopBy: end
        - follows:
            kind: attribute_item
            pattern: "#[cfg(test)]"
            stopBy: neighbor
      stopBy: end
