[package]
name = "auditeur-plugin-macros"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
auditeur-macros = { version = "0.1.0", path = "../auditeur-macros" }
proc-macro-crate = "3.1.0"
proc-macro2 = "1.0.79"
quote = "1.0.35"
stabby = "5.1.0"
syn = { version = "2.0.58", features = ["full"] }
thiserror = "1.0.58"

[lib]
proc-macro = true
