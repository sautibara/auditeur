[package]
name = "auditeur-plugin"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
auditeur = { version = "0.1.0", path = "../auditeur", features = [
  "path-any",
  "resource-map",
  "runtime-loading",
] }
auditeur-plugin-macros = { version = "0.1.0", path = "../auditeur-plugin-macros" }
stabby-macros = { version = "6.2.2" }
# for initializing the runtime
tokio = { version = "1.41.1", features = ["full"] }
# for loading
thiserror = { version = "1.0.58", optional = true }
stabby = { version = "72.1.1", features = ["libloading"], optional = true }
libloading = "0.8.3"
tracing = "0.1.40"

[features]
loading = ["dep:thiserror", "dep:stabby"]

[lints.clippy]
enum_glob_use = "warn"
pedantic = "warn"
nursery = "warn"
