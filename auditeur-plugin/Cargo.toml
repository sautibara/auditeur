[package]
name = "auditeur-plugin"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
auditeur = { version = "0.1.0", path = "../auditeur" }
auditeur-plugin-macros = { version = "0.1.0", path = "../auditeur-plugin-macros" }
stabby-macros = { version = "6.2.2" }
libloading = "0.8.3"
thiserror = { version = "1.0.58", optional = true }
stabby = { version = "5.1.0", features = ["libloading"], optional = true }

[features]
loading = ["dep:thiserror", "dep:stabby"]
