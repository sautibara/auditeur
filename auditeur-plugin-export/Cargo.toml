[package]
name = "auditeur-plugin-export"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "dylib"]

[dependencies]
parking_lot = "0.12.5"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
rubicon = { version = "3.0", features = ["export-globals"] }
async-io = "2.0"
crossbeam = "0.8"
sharded-slab = "0.1"
blocking = "1.0"
futures = "0.3"
