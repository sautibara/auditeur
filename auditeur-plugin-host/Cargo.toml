[package]
name = "auditeur-plugin-host"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
git2 = "0.19.0"
serde = { version = "1.0.203", features = ["derive"] }
thiserror = "1.0.58"
log = "0.4.21"
directories = "5.0.1"
ron = "0.8.1"
semver = { version = "1.0.23", features = ["serde"] }
tokio = { version = "1.37.0", features = ["full"] }
futures = "0.3.28"
cargo_toml = "0.20.4"
toml = "0.8.16"
auditeur-plugin = { version = "0.1.0", path = "../auditeur-plugin/", features = [
  "loading",
] }
