[package]
name = "auditeur-plugin-host"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
auditeur-plugin = { version = "0.1.0", path = "../auditeur-plugin/", features = [
  "loading",
] }
# async
tokio = { version = "1.37.0", features = ["full"] }
futures = "0.3.28"
# plugin sources
git2 = "0.19.0"
# serializing/deserializing
serde = { version = "1.0.203", features = ["derive"] }
ron = "0.8.1"
toml = "0.8.16"
# working with cargo information
cargo_toml = "0.20.4"
cargo_metadata = "0.18.1"
# config-related types
directories = "5.0.1"
semver = { version = "1.0.23", features = ["serde"] }
# rubicon
auditeur-plugin-export = { path = "../auditeur-plugin-export/" }
# other
tracing = "0.1.40"
thiserror = "1.0.58"
regex = "1.10.6"
base64 = "0.22"
ignore = "0.4.25"

[build-dependencies]
# for getting build information to be used to build plugins
built = { version = "0.7.4", features = ["git2"] }

[lints.clippy]
enum_glob_use = "warn"
pedantic = "warn"
nursery = "warn"
