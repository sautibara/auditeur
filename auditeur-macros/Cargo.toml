[package]
name = "auditeur-macros"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
proc-macro-crate = "3.1.0"
proc-macro2 = "1.0.79"
quote = "1.0.35"
syn = { version = "2.0.85", features = ["full"] }
thiserror = "1.0.58"

[lib]
proc-macro = true

[features]
path-any = []
runtime-loading = []

[lints.clippy]
enum_glob_use = "warn"
pedantic = "warn"
nursery = "warn"
