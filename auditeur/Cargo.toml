[package]
name = "auditeur"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.82"
async-trait = "0.1.80"
auditeur-macros = { version = "0.1.0", path = "../auditeur-macros" }
bevy_utils_proc_macros = "0.13.2"
futures = "0.3.30"
log = "0.4.21"
thiserror = "1.0.58"
tokio = { version = "1.37.0", features = ["full"] }

[lints.clippy]
enum_glob_use = "warn"
pedantic = "warn"
nursery = "warn"
