[package]
name = "auditeur"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# error handling
anyhow = "1.0"
thiserror = "2.0"
# async support
tokio = { version = "1.48.0", features = ["full"] }
async-trait = "0.1.80"
async-recursion = "1.1.1"
futures = "0.3.30"
flume = { version = "0.12.0", features = ["async"] }
# macros crate
auditeur-macros = { version = "0.1.0", path = "../auditeur-macros" }
# others
bevy_utils_proc_macros = "0.13.2"
tracing = "0.1.41"
serde = "1.0.219"
hashbrown = "0.15"
namespaced-id = { version = "0.1.0", features = ["serde"], path = "../namespaced-id/namespaced-id" }
im = "15.1.0"

[lints.clippy]
enum_glob_use = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# too much work
unused_async_trait_impl = "allow"

[features]
path-any = ["auditeur-macros/path-any"]
resource-map = []
runtime-loading = ["resource-map", "auditeur-macros/runtime-loading"]
