[package]
name = "auditeur"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# error handling
anyhow = "1.0.82"
thiserror = "1.0.58"
# async support
tokio = { version = "1.37.0", features = ["full"] }
async-trait = "0.1.80"
async-recursion = "1.1.1"
futures = "0.3.30"
# macros crate
auditeur-macros = { version = "0.1.0", path = "../auditeur-macros" }
# others
bevy_utils_proc_macros = "0.13.2"
log = "0.4.21"

[lints.clippy]
enum_glob_use = "warn"
pedantic = "warn"
nursery = "warn"

[features]
path-any = ["auditeur-macros/path-any"]
resource-map = []
runtime-loading = ["auditeur-macros/runtime-loading"]
