[package]
name = "auditeur"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# error handling
anyhow = "1.0.82"
thiserror = "1.0.58"
# async support
tokio = { version = "1.41.1", features = ["full"] }
async-trait = "0.1.80"
async-recursion = "1.1.1"
futures = "0.3.30"
# macros crate
auditeur-macros = { version = "0.1.0", path = "../auditeur-macros" }
# others
bevy_utils_proc_macros = "0.13.2"
dashmap = { version = "6.0.1" }
tracing = "0.1.40"
send-future = "0.1.0"
slice-dst = "1.5.1"
serde = "1.0.219"
hashbrown = "0.15"

[lints.clippy]
enum_glob_use = "warn"
pedantic = "warn"
nursery = "warn"

[features]
path-any = ["auditeur-macros/path-any"]
resource-map = []
runtime-loading = ["resource-map", "auditeur-macros/runtime-loading"]
